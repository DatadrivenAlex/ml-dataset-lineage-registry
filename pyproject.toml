[project]
name = "ml-dataset-lineage-registry"
version = "0.1.0"
description = "Versioned, validated dataset manifests and lineage for ML teams"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
